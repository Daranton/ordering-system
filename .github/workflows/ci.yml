name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: orders_user
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5433:5432   # matches TEST_DATABASE_URL in tests/orders/integration/conftest.py
        options: >-
          --health-cmd "pg_isready -U orders_user -d orders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://orders_user:dev_password@localhost:5433/orders_test
      AUTH_DATABASE_URL: postgresql+psycopg://auth_user:dev_password@localhost:4321/auth

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Type check (mypy strict)
        run: mypy .

      - name: Unit tests
        run: pytest tests/orders/unit -v

      - name: Integration tests
        run: pytest tests/orders/integration -v
